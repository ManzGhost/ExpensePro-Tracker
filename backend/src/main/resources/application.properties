# ===================================================================
# ExpenseFlow Spring Boot & MongoDB Configuration
# ===================================================================
spring.application.name=expenseflow-backend
server.port=8080

# MongoDB Configuration via Environment Variable (with sensible local fallback)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expenseflow}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:expenseFlowSuperSecretKey2026WithSufficientBitLengthForHS512Security}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Logging Configuration
logging.level.com.expenseflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
spring.main.allow-bean-definition-overriding=true